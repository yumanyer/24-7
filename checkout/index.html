<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout 24/SIETE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../shared-navbar.css" />
    <link rel="stylesheet" href="../shared-cart-drawer.css" />
  </head>
  <body>
    <header class="site-navbar">
      <a class="navbar-brand" href="../index.html">24/SIETE</a>
      <nav class="navbar-icons" aria-label="Navegación principal">
        <a class="navbar-icon" href="../index.html" aria-label="Home" title="HOME">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg>
        </a>
        <a class="navbar-icon" href="../collection/index.html" aria-label="Collection" title="COLLECTION">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
        </a>
        <a class="navbar-icon" href="../contacto/index.html" aria-label="Contacto" title="CONTACTO">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </a>
      </nav>
      <button class="navbar-cart" aria-label="Carrito">
        <span>🛒</span>
        <span class="cart-badge" hidden>0</span>
      </button>
    </header>
    <div class="checkout-shell">

      <main class="checkout-main">
        <section class="checkout-heading">
          <h1>CHECKOUT</h1>
          <p>SECURE INDUSTRIAL GATEWAY V2.4</p>
        </section>

        <div class="checkout-grid">
          <section class="checkout-form">
            <article class="checkout-section">
              <div class="section-label">
                <span>01</span>
                <h2>DATOS DE ENVÍO</h2>
              </div>

              <div class="shipping-grid">
                <label class="field-group">
                  <span>NOMBRE COMPLETO</span>
                  <div class="field">EJ. ALEX KROSS</div>
                </label>
                <label class="field-group">
                  <span>TELÉFONO</span>
                  <div class="field">+54 911 0000 0000</div>
                </label>
                <label class="field-group full-width">
                  <span>DIRECCIÓN DE ENTREGA</span>
                  <div class="field">CALLE, NÚMERO, DPTO</div>
                </label>
                <label class="field-group">
                  <span>CIUDAD</span>
                  <div class="field">BUENOS AIRES</div>
                </label>
                <label class="field-group">
                  <span>CÓDIGO POSTAL</span>
                  <div class="field">C1425</div>
                </label>
              </div>
            </article>

            <article class="checkout-section">
              <div class="section-label">
                <span>02</span>
                <h2>MÉTODO DE PAGO</h2>
              </div>

              <div class="payment-grid">
                <button class="payment-option selected" type="button" data-method="mercado">
                  <div class="payment-title">MERCADO PAGO</div>
                  <div class="payment-detail">
                    <img src="https://www.figma.com/api/mcp/asset/af1dc861-6844-4bb0-af49-b33a433af358.svg" alt="Tarjeta icon" />
                    <span>TODAS LAS TARJETAS / CUOTAS</span>
                  </div>
                </button>
                <button class="payment-option" type="button" data-method="transferencia">
                  <div class="payment-title">TRANSFERENCIA / WHATSAPP</div>
                  <div class="payment-detail">
                    <img src="https://www.figma.com/api/mcp/asset/462cdd3c-a1b5-4c8c-a811-6a43b1bdb831.svg" alt="WhatsApp icon" />
                    <span>15% OFF PAGO DIRECTO</span>
                  </div>
                </button>
              </div>
            </article>
          </section>

          <aside class="checkout-summary">
            <div class="summary-heading">RESUMEN DE ORDEN</div>
            <div class="summary-items" id="summaryItems"></div>

            <div class="summary-breakline"></div>

            <div class="summary-totals">
              <div class="summary-row">
                <span>SUBTOTAL</span>
                <strong class="js-subtotal">$0.00</strong>
              </div>
              <div class="summary-row">
                <span>ENVÍO</span>
                <strong>GRATIS</strong>
              </div>
              <div class="summary-row total-row">
                <span>TOTAL</span>
                <strong class="js-total">$0.00</strong>
              </div>
            </div>

            <button class="checkout-button" type="button" id="finalizeBtn">FINALIZAR COMPRA</button>

            <div class="security-note">
              <img src="https://www.figma.com/api/mcp/asset/31e12c1b-e04b-4743-91a3-79a799fafa72.svg" alt="Lock icon" />
              <span>TRANSMISIÓN ENCRIPTADA 256-BIT</span>
            </div>
          </aside>
        </div>
      </main>

      <footer class="checkout-footer">
        <div>
          <div class="footer-brand">24/SIETE</div>
          <div class="footer-copy">© 2024 24/SIETE INDUSTRIAL</div>
        </div>
        <div class="footer-links">
          <a href="#">TERMS</a>
          <a href="#">SHIPPING</a>
          <a href="../contacto/index.html">CONTACT</a>
          <a href="../index.html#archive">ARCHIVE</a>
        </div>
      </footer>
    </div>

    <script src="../shared-cart-drawer.js"></script>
    <script src="script.js"></script>
  </body>
</html>
